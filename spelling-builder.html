<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spelling Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1d2b5c; --gold:#f2b632; --gold2:#ffd76a; --bg:#fff8ea; --card:#ffffff;
  --ink:#1d2340; --fred:Fredoka,'Arial Rounded MT Bold',system-ui,-apple-system,sans-serif; --muted:#5d6480; --good:#1fa863; --goodbg:#e3f8ec; --bad:#e2483d; --badbg:#fdeceb;
  --accent:#ef6c1a; --accent2:#b84f0c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:19px;line-height:1.45}
body{background-image:radial-gradient(circle at 10% 0%,#ffe9b8 0,transparent 40%),radial-gradient(circle at 100% 30%,color-mix(in srgb,var(--accent) 18%,transparent) 0,transparent 40%);min-height:100vh}
h1,h2,h3,.fred{font-family:var(--fred);font-weight:700;margin:0}
button{font:inherit;cursor:pointer;border:none;touch-action:manipulation}
.wrap{max-width:920px;margin:0 auto;padding:12px 16px 60px}
header.top{display:flex;align-items:center;gap:14px;padding:10px 4px 6px;flex-wrap:wrap}
.logo img{height:74px;display:block}
.wordmark{display:flex;align-items:center;gap:8px;font-family:var(--fred);font-weight:700;color:var(--navy);font-size:18px;line-height:1.05}
.wordmark .k{font-size:34px}
.wordmark small{display:block;font-family:Nunito,system-ui,sans-serif;font-weight:700;font-size:11px;color:var(--muted)}
.titlebox{flex:1;min-width:220px}
.titlebox h1{font-size:30px;color:var(--navy)}
.std{display:inline-block;background:var(--navy);color:#fff;border-radius:999px;padding:3px 12px;font-size:13px;font-weight:800;margin-top:4px}
.whoami{font-weight:800;color:var(--navy);background:#fff;border-radius:999px;padding:6px 14px;box-shadow:0 2px 0 #0001}
.card{background:var(--card);border-radius:24px;padding:22px;box-shadow:0 6px 0 #1d2b5c18,0 10px 30px #1d2b5c14;margin-top:14px}
.big-btn{background:var(--accent);color:#fff;font-family:var(--fred);font-weight:700;font-size:24px;padding:16px 30px;border-radius:18px;box-shadow:0 6px 0 var(--accent2);transition:transform .08s}
.big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--accent2)}
.big-btn:disabled{opacity:.45;cursor:default}
.btn{background:#fff;color:var(--navy);font-weight:800;padding:10px 18px;border-radius:14px;border:3px solid #dfe3f0;font-size:18px}
.btn:active{transform:translateY(2px)}
.spk{background:var(--gold);color:var(--navy);font-weight:800;border-radius:16px;padding:12px 18px;font-size:20px;box-shadow:0 5px 0 #c98f12;display:inline-flex;align-items:center;gap:8px}
.spk:active{transform:translateY(3px);box-shadow:0 2px 0 #c98f12}
.spk.playing{animation:pulse 1s infinite}
@keyframes pulse{50%{filter:brightness(1.15);transform:scale(1.04)}}
.spk.huge{font-size:30px;padding:22px 34px;border-radius:24px}
.dirs{list-style:none;padding:0;margin:14px 0}
.dirs li{display:flex;gap:12px;align-items:flex-start;background:#f5f7ff;border-radius:14px;padding:10px 14px;margin:8px 0;font-weight:700}
.dirs li .e{font-size:26px;line-height:1}
.progress{height:16px;background:#e8ebf5;border-radius:999px;overflow:hidden;margin:6px 0 4px}
.progress>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:999px;transition:width .4s}
.plabel{display:flex;justify-content:space-between;font-weight:800;color:var(--muted);font-size:15px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:16px}
.choice{background:#fff;border:3px solid #dfe3f0;border-radius:18px;padding:16px;font-size:24px;font-weight:800;color:var(--navy);text-align:center;font-family:var(--fred);box-shadow:0 4px 0 #dfe3f0}
.choice:active{transform:translateY(3px);box-shadow:0 1px 0 #dfe3f0}
.choice.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,#fff)}
.choice.right{border-color:var(--good);background:var(--goodbg);color:#0d6b3c}
.choice.wrong{border-color:var(--bad);background:var(--badbg);color:#a0231b}
.choice:disabled{cursor:default}
.fb{margin-top:16px;border-radius:18px;padding:14px 18px;font-weight:800;display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.fb.good{background:var(--goodbg);color:#0d6b3c}
.fb.bad{background:var(--badbg);color:#8d1f18}
.fb .e{font-size:30px;line-height:1}
.fb .msg{flex:1;min-width:200px}
.fb .tip{font-weight:700;color:var(--ink);margin-top:4px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.center{text-align:center}
.prompt{font-size:22px;font-weight:800;color:var(--navy);margin:6px 0 4px}
.hint{color:var(--muted);font-weight:700;font-size:16px}
.bigword{font-family:var(--fred);font-size:52px;color:var(--navy);letter-spacing:1px;text-align:center;margin:10px 0}
input.name{font:inherit;font-size:24px;padding:12px 16px;border-radius:14px;border:3px solid #dfe3f0;width:100%;max-width:420px;font-weight:800;color:var(--navy)}
input.name:focus{outline:none;border-color:var(--accent)}
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:14px}
.stop{border-radius:18px;padding:14px;background:#f5f7ff;border:3px dashed #cfd5ea;font-weight:800;text-align:center}
.stop .e{font-size:34px;display:block}
.stop.now{border:3px solid var(--accent);background:color-mix(in srgb,var(--accent) 9%,#fff)}
.stop.done{border:3px solid var(--good);background:var(--goodbg)}
.summary table{width:100%;border-collapse:collapse;margin-top:10px}
.summary td,.summary th{padding:9px 10px;border-bottom:2px solid #eef0f7;text-align:left}
.summary th{color:var(--muted);font-size:15px}
.stamp{display:inline-block;background:var(--gold);color:var(--navy);font-family:var(--fred);font-weight:700;border-radius:14px;padding:6px 14px;font-size:22px}
.shot{background:#eef3ff;border:3px solid #c9d6ff;border-radius:18px;padding:14px 16px;margin-top:16px;font-weight:700}
.foot{margin-top:28px;text-align:center;color:var(--muted);font-size:13px;font-weight:700}
.foot button{background:none;color:var(--muted);text-decoration:underline;font-size:13px;font-weight:700}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;font-weight:800;z-index:50;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.built{min-height:86px;border:4px dashed #f6c9a6;border-radius:20px;margin:16px 0 8px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px;padding:8px;background:#fff8f2}
.built .bc{font-family:var(--fred);font-size:42px;color:var(--navy);background:#ffe3cc;border-radius:12px;padding:0 10px}
.built .ph{color:#d8b79c;font-weight:800}
.built.right{border-color:var(--good);background:var(--goodbg)} .built.wrong{border-color:var(--bad);background:var(--badbg)}
.pool{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:10px}
.tile{font-family:var(--fred);font-size:30px;background:#fff;color:var(--navy);border:3px solid #f2c9a8;border-radius:16px;padding:10px 20px;box-shadow:0 5px 0 #f2c9a8;min-width:80px}
.tile:active{transform:translateY(3px);box-shadow:0 2px 0 #f2c9a8}
.tile.used{visibility:hidden}
.sent{font-size:28px;font-weight:800;color:var(--navy);text-align:center;margin:14px 0}
.sent .blank{display:inline-block;min-width:130px;border-bottom:4px solid var(--accent);margin:0 6px}
.rules{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
.rules div{background:#fff3e8;border-radius:14px;padding:10px 12px;font-weight:700}
@media (max-width:600px){.rules{grid-template-columns:1fr}.built .bc{font-size:32px}.tile{font-size:24px}}

@media (max-width:600px){.titlebox h1{font-size:24px}.bigword{font-size:38px}.choice{font-size:20px}.spk.huge{font-size:24px}}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div class="toast" id="toast"></div>
<div class="wrap">
  <header class="top">
    <div class="logo" id="logo"></div>
    <div class="titlebox"><h1>🧱 Spelling Builder</h1><span class="std">ELA.612.F.2.3 · Encoding</span></div>
    <div class="whoami" id="whoami" hidden></div>
  </header>
  <main id="app"></main>
  <div class="foot">The Literacy Locksmith · created and copyrighted by Donna Rees · Your work saves on this iPad automatically.<br>
    <button id="resetBtn">Teacher: reset this page</button></div>
</div>

const $ = (s, r=document) => r.querySelector(s);
const h = (tag, attrs={}, ...kids) => { const el=document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})) { if(k==='class') el.className=v; else if(k==='html') el.innerHTML=v;
    else if(k.startsWith('on')) el.addEventListener(k.slice(2),v); else if(v!==false&&v!=null) el.setAttribute(k,v===true?'':v); }
  for (const k of kids.flat()) if(k!=null&&k!==false) el.append(k.nodeType?k:document.createTextNode(k)); return el; };
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

/* ---------- audio (Heart voice clips) ----------
   Plays through a normal <audio> element first. If that is blocked (iPad autoplay rules,
   school filters, or preview windows), it switches to the Web Audio engine automatically. */
const player = new Audio(); player.preload='auto'; player.setAttribute('playsinline','');
let curBtn=null, seqToken=0, mode='el', waSrc=null, actx=null;
try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}
function ctx(){ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); return actx; }
function bytes(key){ const b=atob(AUDIO[key].split(',')[1]); const u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u.buffer; }
const BURL={}, DEC={};
function burl(k){ if(!BURL[k]){ try{ BURL[k]=URL.createObjectURL(new Blob([bytes(k)],{type:'audio/mpeg'})); }catch(e){ BURL[k]=AUDIO[k]; } } return BURL[k]; }
function unlock(){ try{ const c=ctx(); if(c.state!=='running') c.resume(); const s=c.createBufferSource(); s.buffer=c.createBuffer(1,1,22050); s.connect(c.destination); s.start(0); }catch(e){} }
['pointerdown','touchend','click','keydown'].forEach(ev=>document.addEventListener(ev,unlock,{capture:true,passive:true}));
function decode(k){ return new Promise((res,rej)=>{ if(DEC[k]) return res(DEC[k]); const c=ctx();
  try{ const p=c.decodeAudioData(bytes(k),b=>{DEC[k]=b;res(b);},rej); if(p&&p.then) p.then(b=>{DEC[k]=b;res(b);}).catch(rej); }catch(e){ rej(e); } }); }
async function waPlay(k,tok,onend,onfail){
  try{ const c=ctx(); if(c.state!=='running'){ try{ await c.resume(); }catch(e){} }
    const buf=await decode(k); if(tok!==seqToken) return;
    const s=c.createBufferSource(); s.buffer=buf; s.connect(c.destination); waSrc=s;
    s.onended=()=>{ if(tok===seqToken && waSrc===s){ waSrc=null; onend(); } }; s.start(0);
  }catch(e){ onfail&&onfail(); } }
function rawPlay(k,tok,onend,onfail){
  if(!AUDIO[k]){ console.warn('missing audio',k); return onend(); }
  if(mode==='wa') return waPlay(k,tok,onend,onfail);
  let switched=false; const sw=()=>{ if(switched||tok!==seqToken) return; switched=true; waPlay(k,tok,onend,onfail); };
  player.onended=()=>{ if(tok===seqToken) onend(); };
  player.onerror=()=>{ if(tok!==seqToken) return; mode='wa'; sw(); };
  player.src=burl(k);
  try{ const p=player.play(); if(p&&p.catch) p.catch(err=>{ if(tok!==seqToken) return; if(!err||err.name!=='AbortError'){ if(err&&err.name!=='NotAllowedError') mode='wa'; sw(); } }); }
  catch(e){ mode='wa'; sw(); }
}
function stopAudio(){ seqToken++; try{player.pause();}catch(e){} if(waSrc){ const s=waSrc; waSrc=null; try{s.stop();}catch(e){} }
  if(curBtn){curBtn.classList.remove('playing');curBtn=null;} }
function play(key, btn, onend){
  stopAudio(); const tok=seqToken; if(btn){curBtn=btn;btn.classList.add('playing');}
  const fin=()=>{ if(btn) btn.classList.remove('playing'); if(curBtn===btn) curBtn=null; };
  rawPlay(key,tok,()=>{ fin(); onend&&onend(); },()=>{ fin(); onend&&onend(); });
}
function playSeq(keys, onEach, onDone){
  stopAudio(); const tok=seqToken; let i=0;
  const next=()=>{ if(tok!==seqToken) return; if(i>=keys.length){onDone&&onDone();return;}
    onEach&&onEach(i); rawPlay(keys[i],tok,()=>{ i++; next(); },()=>{ i++; next(); }); };
  next(); return ()=>{ stopAudio(); };
}
function spk(key, label='🔊 Listen', cls=''){ const b=h('button',{class:'spk '+cls}); b.innerHTML=label; b.onclick=()=>play(key,b); return b; }

/* little chime sounds (not voice) */
function chime(good){ try{ ctx();
  const notes=good?[660,880,1175]:[300,220]; notes.forEach((f,i)=>{ const o=actx.createOscillator(),g=actx.createGain();
    o.type=good?'triangle':'sine'; o.frequency.value=f; o.connect(g); g.connect(actx.destination);
    const t=actx.currentTime+i*0.09; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.18,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.28);
    o.start(t); o.stop(t+0.3); }); }catch(e){} }

/* ---------- confetti ---------- */
function confetti(ms=3500){ const c=$('#confetti'),x=c.getContext('2d'); c.width=innerWidth; c.height=innerHeight;
  const cols=['#f2b632','#1d2b5c','#e2483d','#1fa863','#3b82f6','#a855f7','#ff7ab6'];
  const P=Array.from({length:180},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*0.6,w:6+Math.random()*8,h:8+Math.random()*10,
    vy:2+Math.random()*4,vx:-2+Math.random()*4,r:Math.random()*6,vr:-.2+Math.random()*.4,c:cols[Math.floor(Math.random()*cols.length)]}));
  const end=performance.now()+ms;
  (function f(t){ x.clearRect(0,0,c.width,c.height); P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr; x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore();});
    if(t<end) requestAnimationFrame(f); else x.clearRect(0,0,c.width,c.height); })(performance.now());
}

/* ---------- autosave ---------- */
const KEY='locksmith_'+PAGE_ID;
let S=null;
try{ S=JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){}
if(!S) S={name:'',part:-1,idx:0,results:{},extra:{},done:false,started:null,finished:null};
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
$('#resetBtn').onclick=()=>{ if(confirm('Erase all saved work on this page for this iPad?')){ try{localStorage.removeItem(KEY);}catch(e){} if(window.onReset) window.onReset(); location.reload(); } };

/* ---------- praise ---------- */
const GOOD=['good1','good2','good3','good4'], BAD=['bad1','bad2'];
const GOODTXT={good1:'Great job!',good2:'You got it!',good3:'Awesome!',good4:'Nice work!'};
const BADTXT={bad1:'Not quite. Check out the right answer.',bad2:'Good try! Here is the right answer.'};
function feedback(box, ok, tipHTML, nextFn, opts={}){
  chime(ok);
  const k = ok? GOOD[Math.floor(Math.random()*GOOD.length)] : BAD[Math.floor(Math.random()*BAD.length)];
  const fb=h('div',{class:'fb pop '+(ok?'good':'bad')},
    h('span',{class:'e'},ok?'✅':'💡'),
    h('div',{class:'msg'}, h('div',{}, ok?GOODTXT[k]:BADTXT[k]), tipHTML? h('div',{class:'tip',html:tipHTML}):null),
  );
  const nb=h('button',{class:'big-btn',onclick:()=>{ stopAudio(); nextFn(); }}, opts.nextLabel||'Next ➜');
  fb.append(nb); box.append(fb);
  setTimeout(()=>{ if(opts.after) play(k,null,()=>play(opts.after)); else play(k); },150);
  setTimeout(()=>fb.scrollIntoView({behavior:'smooth',block:'nearest'}),50);
}

/* ---------- engine ---------- */
const PARTS = DATA.parts;
const RENDER = {}; // filled by page script: RENDER[type](item, box, done, part)
const app=$('#app');
function setWho(){ const w=$('#whoami'); if(S.name){ w.hidden=false; w.textContent='👤 '+S.name; } }
function partScore(pi){ const r=S.results[pi]||[]; return {right:r.filter(x=>x&&x.ok).length,total:PARTS[pi].items?PARTS[pi].items.length:0}; }

function screenStart(){
  stopAudio(); app.innerHTML='';
  const inp=h('input',{class:'name',placeholder:'Type your first name',value:S.name||'',maxlength:30,autocomplete:'off'});
  const go=h('button',{class:'big-btn',onclick:()=>{ const n=inp.value.trim(); if(!n){ inp.classList.add('shake'); setTimeout(()=>inp.classList.remove('shake'),400); toast('Type your name first ✏️'); inp.focus(); return; }
    S.name=n; if(!S.started) S.started=new Date().toISOString(); if(S.part<0){S.part=0;S.idx=0;} save(); setWho(); screenMap(); }}, S.part>=0?'Keep going ➜':"Let's start ➜");
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')go.click();});
  const card=h('div',{class:'card pop'},
    h('div',{class:'row'}, spk('welcome','🔊 Listen to the directions','huge')),
    h('h2',{style:'margin-top:16px;color:var(--navy)'}, S.part>=0?`Welcome back, ${S.name}! 👋`:'Welcome, reader! 👋'),
    h('p',{html:DATA.intro}),
    h('ul',{class:'dirs'}, DATA.howto.map(d=>h('li',{},h('span',{class:'e'},d[0]),h('span',{},d[1])))),
    h('p',{class:'prompt'},'✏️ What is your name?'), inp, h('div',{style:'margin-top:16px'},go)
  );
  app.append(card);
}

function screenMap(){
  stopAudio(); app.innerHTML='';
  if(S.done){ return screenSummary(); }
  const card=h('div',{class:'card pop'},
    h('h2',{style:'color:var(--navy)'},'🗺️ Your stations'),
    h('p',{class:'hint'},'Finish each station in order. Your work saves on this iPad as you go.'),
    h('div',{class:'map'}, PARTS.map((p,i)=>h('div',{class:'stop '+(i<S.part?'done':i===S.part?'now':'')},
      h('span',{class:'e'}, i<S.part?'✅':p.emoji), `Station ${i+1}`, h('br'), p.title))),
    h('div',{style:'margin-top:18px'}, h('button',{class:'big-btn',onclick:()=>screenPartIntro()}, `Go to Station ${S.part+1} ➜`))
  );
  app.append(card);
}

function screenPartIntro(){
  stopAudio(); app.innerHTML=''; const p=PARTS[S.part];
  if(S.idx>0 && p.items && S.idx<p.items.length) return screenItem();
  const card=h('div',{class:'card pop'},
    h('div',{class:'plabel'},h('span',{},`Station ${S.part+1} of ${PARTS.length}`),h('span',{},p.emoji+' '+p.title)),
    h('h2',{style:'color:var(--navy);font-size:32px;margin:6px 0'}, p.emoji+' '+p.title),
    h('div',{class:'row'}, spk('dir'+S.part,'🔊 Hear the directions','huge')),
    h('ul',{class:'dirs'}, p.dirs.map(d=>h('li',{},h('span',{class:'e'},d[0]),h('span',{html:d[1]})))),
    p.ref? h('div',{html:p.ref}) : null,
    h('button',{class:'big-btn',onclick:()=>{ if(p.custom){ screenItem(); } else screenItem(); }}, "I'm ready ➜")
  );
  app.append(card);
  setTimeout(()=>play('dir'+S.part, card.querySelector('.spk')),250);
}

function screenItem(){
  stopAudio(); app.innerHTML=''; const p=PARTS[S.part];
  if(p.custom){ const box=h('div',{class:'card pop'}); app.append(box); RENDER[p.type](p, box, (data)=>{ S.extra[S.part]=data; nextPart(); }); return; }
  const it=p.items[S.idx];
  const box=h('div',{class:'card pop'},
    h('div',{class:'plabel'},h('span',{},`${p.emoji} ${p.title}`),h('span',{},`${S.idx+1} of ${p.items.length}`)),
    h('div',{class:'progress'},h('div',{style:`width:${(S.idx)/p.items.length*100}%`}))
  );
  app.append(box);
  RENDER[p.type](it, box, (ok, ans, tip, opts)=>{
    (S.results[S.part] ||= [])[S.idx]={ok, ans}; save();
    box.querySelector('.progress>div').style.width=`${(S.idx+1)/p.items.length*100}%`;
    feedback(box, ok, tip, ()=>{ S.idx++; save(); if(S.idx>=p.items.length) nextPart(); else screenItem(); }, opts||{});
  }, p, S.idx);
}

function nextPart(){
  const done=S.part; S.part++; S.idx=0; save();
  if(S.part>=PARTS.length){ S.done=true; S.finished=new Date().toISOString(); save(); confetti(4500); play('alldone'); return screenSummary(); }
  confetti(1800); play('stationdone');
  app.innerHTML='';
  const sc=partScore(done);
  app.append(h('div',{class:'card pop center'},
    h('div',{style:'font-size:70px'},'🔓'),
    h('h2',{style:'color:var(--navy);font-size:30px'},`Station ${done+1} unlocked!`),
    PARTS[done].items? h('p',{class:'prompt'},`You got ${sc.right} out of ${sc.total}.`):null,
    h('button',{class:'big-btn',onclick:screenMap},'Next station ➜')));
}

function screenSummary(){
  stopAudio(); app.innerHTML='';
  let R=0,T=0; const rows=PARTS.map((p,i)=>{ if(p.custom) return h('tr',{},h('td',{},p.emoji+' '+p.title),h('td',{html:(window.customSummary?customSummary(i):'Done ✅')}));
    const s=partScore(i); R+=s.right; T+=s.total;
    const missed=(S.results[i]||[]).map((r,j)=>r&&!r.ok?(p.items[j].label||p.items[j].word||('#'+(j+1))):null).filter(Boolean);
    return h('tr',{},h('td',{},p.emoji+' '+p.title),h('td',{html:`<b>${s.right} / ${s.total}</b>`+(missed.length?`<br><span class="hint">Practice: ${missed.join(', ')}</span>`:'')})); });
  const d=new Date(S.finished||Date.now());
  const card=h('div',{class:'card pop summary'},
    h('div',{class:'center'},h('div',{style:'font-size:64px'},'🏆'),h('h2',{style:'color:var(--navy);font-size:32px'},`You did it, ${S.name}!`),
      T? h('div',{class:'stamp',style:'margin-top:8px'},`Score: ${R} / ${T}  (${Math.round(R/T*100)}%)`):null),
    h('table',{},h('tr',{},h('th',{},'Name'),h('td',{},h('b',{},S.name))),h('tr',{},h('th',{},'Date'),h('td',{},d.toLocaleDateString()+' '+d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}))),
      h('tr',{},h('th',{},'Activity'),h('td',{},DATA.title+' · '+DATA.std)), ...rows),
    h('div',{class:'shot'},'📸 ',h('b',{},'Turn it in: '),'Take a screenshot of this card (press the ',h('b',{},'top button + volume up'),' together — or ',h('b',{},'top button + Home button'),' if your iPad has a Home button). Then upload the screenshot to the assignment in ',h('b',{},'Canvas'),'.'),
    window.extraSummary? extraSummary(): null,
    h('div',{class:'row',style:'margin-top:16px'}, h('button',{class:'btn',onclick:()=>confetti(3000)},'🎉 Confetti again'))
  );
  app.append(card);
  confetti(3500);
}

window.addEventListener('DOMContentLoaded',()=>{});
</script>
<script>

RENDER.build=(it,box,done)=>{
  const k='w'+S.idx; const picked=[];
  const built=h('div',{class:'built'}); const pool=h('div',{class:'pool'});
  const draw=()=>{ built.innerHTML=''; if(!picked.length) built.append(h('span',{class:'ph'},'Tap chunks to build the word…'));
    picked.forEach(p=>built.append(h('span',{class:'bc'},p.t))); chk.disabled=!picked.length; };
  let locked=false;
  shuffle([...it.chunks,...it.decoys]).forEach(t=>{ const b=h('button',{class:'tile'},t);
    b.onclick=()=>{ if(locked) return; picked.push({t,b}); b.classList.add('used'); draw(); }; pool.append(b); });
  const undo=h('button',{class:'btn',onclick:()=>{ if(locked) return; const p=picked.pop(); if(p){p.b.classList.remove('used'); draw();} }},'↩️ Undo');
  const clr=h('button',{class:'btn',onclick:()=>{ if(locked) return; while(picked.length){picked.pop().b.classList.remove('used');} draw(); }},'🧹 Clear');
  const chk=h('button',{class:'big-btn'},'✅ Check');
  chk.onclick=()=>{ if(locked||!picked.length) return; locked=true; chk.disabled=true;
    const mine=picked.map(p=>p.t).join(''); const ok=mine===it.word; built.classList.add(ok?'right':'wrong');
    done(ok,mine,(ok?'':`You built <b>${mine}</b>. `)+`Correct: <b>${it.chunks.join(' + ')} = ${it.word}</b><br>${it.tip}`,{after:'wo'+S.idx}); };
  const s=spk(k,'🔊 Hear the word','huge');
  box.append(h('p',{class:'prompt'},'Listen, then build the word with chunks.'), h('div',{class:'center',style:'margin:10px 0'},s),
    built, pool, h('div',{class:'row',style:'justify-content:center;margin-top:18px'},undo,clr,chk));
  draw(); setTimeout(()=>play(k,s),200);
};
RENDER.rule=(it,box,done)=>{
  const k='r'+S.idx; const parts=it.sent.split('___');
  const sent=h('div',{class:'sent'},parts[0],h('span',{class:'blank'},' '),parts[1]);
  const s=spk(k,'🔊 Hear the sentence');
  box.append(h('p',{class:'prompt'},'Which word is spelled correctly?'), h('div',{class:'center'},s), sent);
  const g=h('div',{class:'choices'}); let used=false;
  shuffle(it.choices).forEach(c=>{ const b=h('button',{class:'choice'},c); b.dataset.c=c;
    b.onclick=()=>{ if(used) return; used=true; g.querySelectorAll('button').forEach(x=>x.disabled=true);
      const ok=c===it.answer; b.classList.add(ok?'right':'wrong'); if(!ok) g.querySelector(`[data-c="${it.answer}"]`).classList.add('right');
      sent.querySelector('.blank').textContent=it.answer; done(ok,c,it.rule); };
    g.append(b); });
  box.append(g); setTimeout(()=>play(k,s),200);
};

</script>
<script>
setWho();
if(!S.name || S.part<0) screenStart(); else screenStart();
</script>
